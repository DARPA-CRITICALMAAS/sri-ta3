apiVersion: batch/v1
kind: Job
metadata:
  namespace: criticalmaas-ta3
  name: cmaas-ta3-vasily-cmas-pca-01
  labels:
    app: cmaas-ta3-vasily-cmas-pca-01
    type: run
spec:
  template:
    metadata:
      labels:
        app: cmaas-ta3-vasily-cmas-pca-01
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: gpuType # A5000 or 2080Ti
                operator: In
                values:
                - A5000
              # - key: kubernetes.io/hostname
              #   operator: In
              #   values:
              #   - cse-k8s-cvt-011.k8s.sri.com

      restartPolicy: Never
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
        - name: rw-vol
          persistentVolumeClaim:
            claimName: criticalmaas-ta3-rw
        - name: ro-vol
          persistentVolumeClaim:
            claimName: criticalmaas-ta3-ro
      imagePullSecrets:
      - name: docker-io-secret
      containers:
        - name: cmaas-ta3
          image: open.docker.sarnoff.com/criticalmaas-ta3:cmaas-ta3-e35547-v0.0

          workingDir: /workspace
          resources:
            requests:
              memory: 64Gi
              cpu: 16
              nvidia.com/gpu: 2
            limits:
              memory: 64Gi
              cpu: 16
              nvidia.com/gpu: 2

          ports: # List of ports to expose from the container (can be forwarded using k9s to local machine)
            - containerPort: 8888
              name: notebook-port

          volumeMounts:
            # Working directory for source code
            - name: rw-vol
              subPath: e35547/code/modeling/sri_maper
              mountPath: /workspace/sri_maper
            
            # shared directory for storing data
            - name: ro-vol
              subPath: data
              mountPath: /workspace/data

            # Working directory for checkpoints, output, etc.
            - name: rw-vol
              subPath: e35547/logs
              mountPath: /workspace/logs

            # Virtual memory
            - name: dshm
              mountPath: /dev/shm

          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WANDB_API_KEY
              value: 10e1de6c8c29476198532b4d90fcee2a87a2da79
