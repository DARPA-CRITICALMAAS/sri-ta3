# @package _global_

defaults:
  - override /preprocess: h4_ceus_mvt_v0.yaml
  - override /model: maevit_classifier.yaml
  - override /trainer: ddp
  - override /callbacks: default.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["ViT",  "smidcont", "mvt", "v0"]
task_name: "h4-cmta3-classifier-mvt-smidcont"

seed: 777
enable_attributions: false

data:
  window_size: 5
  tif_dir: ${paths.data_dir}/H4/h4_ceus_mvt_v0
  likely_neg_range: [0.1, 0.9]

model:
  net:
    backbone_ckpt: null
    backbone_net:
      _target_: sri_maper.src.models.mae_vit.MAE_ViT
      image_size: ${data.window_size}
      patch_size: 1
      input_dim: 21 # if want to use PCA (i.e., num_pca_components is not null), set it to num_pca_components
      enc_dim: 256
      encoder_layer: 6
      encoder_head: 8
      dec_dim: 128
      output_dim: ${model.net.backbone_net.input_dim}
      decoder_layer: 2
      decoder_head: 4
      mask_ratio: 0.0
    dropout_rate: [0.0, 0.25, 0.25]
  smoothing: 0.3

trainer:
  min_epochs: 100
  max_epochs: 100
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  val_check_interval: 0.5
  # gradient_clip_val: 1.0

logger:
  wandb:
    name: "ViT|pretrained|v0|lr=${model.optimizer.lr}"

callbacks:
  model_checkpoint:
    monitor: val/auprc
  early_stopping:
    monitor: val/auprc_best
