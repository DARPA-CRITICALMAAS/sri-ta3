# @package _global_

defaults:
  - override /preprocess: h4_umidwest_magmatic_ni.yaml
  - override /model: resnet.yaml
  - override /trainer: gpu # ddp #
  - override /callbacks: default.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["ni", "resnet", "h4", "upper-mid-west"]
task_name: "cmta3-classifier-ni-h4-umidw"

seed: 777
enable_attributions: false

data:
  window_size: 5
  tif_dir: ${paths.data_dir}/H4/h4_umidwest_magmatic_ni ### 26 layers
  likely_neg_range: [0.1, 0.9]
  frac_train_split: 0.8
  num_pca_components: null
  in_pca_space: false

model:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-3
    weight_decay: 1e-2
  net:
    _target_: sri_maper.src.models.resnet.ResNet
    num_input_channels: 26
    num_output_classes: 1
    dropout_rate: 0.5
  compile: false
  gain: 1.0
  mc_samples: 100
  smoothing: 0.3
  extract_attributions: ${enable_attributions}

trainer:
  min_epochs: 5
  max_epochs: 100
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  val_check_interval: 0.5

logger:
  wandb:
    name: "resnet|lnr=${data.likely_neg_range}|fts=${data.frac_train_split}|pca=${data.num_pca_components}|in_pca_space=${data.in_pca_space}"

callbacks:
  model_checkpoint:
    monitor: val/auprc
  early_stopping:
    monitor: val/auprc_best
