# @package _global_

defaults:
  - override /preprocess: mvt-smidcont.yaml
  - override /model: maevit_pretrain
  - override /trainer: ddp
  - override /callbacks: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["vit", "mae-vit-pretrain", "smidcont", "mvt"]
task_name: "cmta3-pretrain-maevit"

seed: 1234

data:
  window_size: 5
  batch_size: 1024
  tif_dir: ${paths.data_dir}/H3/mvt-smidcont
  downsample: false
  oversample: false
  frac_train_split: 0.9
  num_pca_components: null
  in_pca_space: false

model:
  net:
    input_dim: 25 # if want to use PCA (i.e., num_pca_components is not null), set it to num_pca_components

trainer:
  min_epochs: 10
  max_epochs: 30
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  val_check_interval: 0.5
  gradient_clip_val: 1.0

logger:
  wandb:
    name: "maevit_pretrain_mvt_smidcont"

callbacks:
  model_checkpoint:
    filename: "psnr_{val/psnr:.3f}"
    monitor: val/psnr
  early_stopping:
    monitor: val/psnr_best
