# @package _global_

defaults:
  - override /preprocess: preprocess_template.yaml
  - override /model: maevit_classifier.yaml
  - override /trainer: gpu
  - override /callbacks: default.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["tags", "of", "your", "choice"] # <- add tags to your experiment
task_name: "task_template" # <- update task name

seed: 777
enable_attributions: false

data:
  window_size: 5
  tif_dir: ${paths.data_dir}/template_folder # raster stack directory
  likely_neg_range: [0.1,1.0]

model:
  net:
    backbone_ckpt: null
    backbone_net:
      _target_: sri_maper.src.models.mae_vit.MAE_ViT
      image_size: ${data.window_size}
      patch_size: 1
      input_dim: 2
      enc_dim: 256
      encoder_layer: 6
      encoder_head: 8
      dec_dim: 128
      output_dim: ${model.net.backbone_net.input_dim}
      decoder_layer: 2
      decoder_head: 4
      mask_ratio: 0.0
    dropout_rate: [0.0, 0.25, 0.25]
  smoothing: 0.3

trainer:
  min_epochs: 5
  max_epochs: 10
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  val_check_interval: 0.5

logger:
  wandb:
    name: "wandb description"

callbacks:
  model_checkpoint:
    monitor: val/auprc
  early_stopping:
    monitor: val/auprc_best
