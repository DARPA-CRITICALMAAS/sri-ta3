# @package _global_

defaults:
  - override /preprocess: preprocess_template.yaml
  - override /model: maevit_pretrain
  - override /trainer: gpu # 'gpu' - single gpu | 'ddp' for multi-gpu
  - override /callbacks: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["tags", "of", "your", "choice"] # <- add tags to your experiment
task_name: "task_template" # <- update task name

seed: 1234

data:
  window_size: 5
  batch_size: 1024
  tif_dir: ${paths.data_dir}/template_folder # raster stack directory
  downsample: false
  oversample: false
  frac_train_split: 0.9

model:
  net:
    input_dim: 2

trainer:
  min_epochs: 10
  max_epochs: 30
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  limit_test_batches: 1.0
  val_check_interval: 0.5
  gradient_clip_val: 1.0

logger:
  wandb:
    name: "wandb description"

callbacks:
  model_checkpoint:
    filename: "psnr_{val/psnr:.3f}"
    monitor: val/psnr
  early_stopping:
    monitor: val/psnr_best
